[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mermicorn-boot"
version = "0.1.1"
description = "Mermicorn Mega Boot — scaffold and validate compliant Mermicorn projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — All Rights Reserved" }
authors = [{ name = "Cherry | Cyber Lazer Mermicorn" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
mermicorn-boot = "mermicorn_boot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
